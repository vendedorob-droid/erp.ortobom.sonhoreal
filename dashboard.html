<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colchoeiro ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <script>
    // Aplica o tema/paleta salvos ANTES da primeira renderização, pra não
    // piscar no tema errado por uma fração de segundo ao carregar a página.
    (function () {
      var t = localStorage.getItem('colchoeiro_theme') || 'dark';
      var p = localStorage.getItem('colchoeiro_palette') || 'indigo';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-palette', p);
    })();
  </script>
</head>
<body>
<div id="app">

  <!-- ══ SIDEBAR ══ -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🛏</div>
      <span class="sidebar-logo-text" id="company-name">Colchoeiro ERP</span>
    </div>

    <div class="sidebar-profile">
      <div class="avatar avatar-sm" id="profile-avatar" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">?</div>
      <div class="sidebar-profile-info">
        <div class="sidebar-profile-name" id="profile-name">Carregando...</div>
        <div class="sidebar-profile-role" id="profile-role"></div>
      </div>
    </div>

    <nav id="sidebar-nav"></nav>
  </aside>

  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- ══ MAIN ══ -->
  <div id="main">
    <header id="topbar">
      <button class="icon-btn" onclick="toggleSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <div class="topbar-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="global-search" placeholder="Buscar produtos, clientes, orçamentos..." oninput="handleSearch(this.value)">
      </div>

      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <button class="icon-btn" onclick="toggleTheme()" id="theme-toggle-btn" aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro">
          <span id="theme-icon" style="font-size:15px">🌙</span>
        </button>

        <div style="position:relative">
          <button class="icon-btn" id="palette-btn" onclick="togglePalettePicker()" aria-label="Paleta de cores" title="Paleta de cores">
            <span style="font-size:15px">🎨</span>
          </button>
          <div id="palette-picker" style="display:none; position:absolute; right:0; top:42px; background:var(--surface); border:1px solid var(--border2); border-radius:12px; padding:10px; gap:8px; z-index:500; box-shadow:0 10px 30px rgba(0,0,0,.3)">
            <button class="palette-dot" data-palette="indigo" style="background:#6366f1" onclick="applyPalette('indigo')" title="Índigo"></button>
            <button class="palette-dot" data-palette="blue" style="background:#3b82f6" onclick="applyPalette('blue')" title="Azul"></button>
            <button class="palette-dot" data-palette="green" style="background:#10b981" onclick="applyPalette('green')" title="Verde"></button>
            <button class="palette-dot" data-palette="rose" style="background:#f43f5e" onclick="applyPalette('rose')" title="Rosa"></button>
            <button class="palette-dot" data-palette="orange" style="background:#f97316" onclick="applyPalette('orange')" title="Laranja"></button>
          </div>
        </div>

        <div style="position:relative">
          <button class="icon-btn" onclick="loadModule('notifications')" aria-label="Notificações">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
          </button>
          <div id="notif-badge" style="display:none;position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#ef4444;border-radius:50%;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">0</div>
        </div>

        <div style="position:relative">
          <div class="avatar avatar-md" id="topbar-avatar" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);cursor:pointer" onclick="toggleUserMenu()">?</div>
          <div id="user-menu" style="display:none;position:absolute;right:0;top:42px;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:6px;min-width:160px;z-index:500">
            <button class="nav-item" style="width:100%" onclick="loadModule('profile')">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>
              <span>Meu perfil</span>
            </button>
            <button class="nav-item" style="width:100%;color:#8b5cf6" onclick="handleSwitchProfile()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>Trocar Perfil</span>
            </button>
            <button class="nav-item" style="width:100%;color:#ef4444" onclick="Auth.switchProfile()">
              <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
              <span>Sair</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="content">
      <div style="display:flex;align-items:center;justify-content:center;height:100%">
        <div class="spinner" style="width:40px;height:40px"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

let currentModule = null;
let currentProfile = null;

Auth.init(async (profile) => {
  if (!profile) {
    window.location.href = 'index.html';
    return;
  }
  currentProfile = profile;
  setupUI(profile);
  await loadModule('dashboard');
});

async function setupUI(profile) {
  const initials = profile.name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('profile-avatar').textContent = initials;
  document.getElementById('topbar-avatar').textContent  = initials;
  document.getElementById('profile-name').textContent   = profile.name;
  document.getElementById('profile-role').textContent   = profile.role.toUpperCase();

  try {
    const snap = await db.collection('companies').doc(profile.companyId).collection('settings').doc('general').get();
    if (snap.exists) {
      document.getElementById('company-name').textContent = snap.data().fantasyName || 'Colchoeiro ERP';
    }
  } catch(e) {}

  buildNav(profile.role);
}

function buildNav(role) {
  const items = NAV_CONFIG[role] || NAV_CONFIG.vendedor;
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  items.forEach(item => {
    if (item.section) {
      const lbl = document.createElement('div');
      lbl.className = 'nav-section-label';
      lbl.textContent = item.section;
      nav.appendChild(lbl);
      return;
    }
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.setAttribute('data-module', item.id);
    btn.onclick = () => loadModule(item.id);
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${item.icon}"/></svg><span>${item.label}</span>${item.dot ? '<span class="nav-dot"></span>' : ''}`;
    nav.appendChild(btn);
  });
}

async function loadModule(moduleId) {
  currentModule = moduleId;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.getAttribute('data-module') === moduleId));
  closeSidebar();
  const content = document.getElementById('content');
  content.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:200px"><div class="spinner"></div></div>';
  
  const modules = {
    'dashboard':  () => Dashboard.render(content),
    'products':   () => Products.render(content),
    'stock':      () => Stock.render(content),
    'brands':     () => Brands.render(content),
    'customers':  () => Customers.render(content),
    'quotes':     () => Quotes.render(content),
    'sales':      () => Sales.render(content),
    'scanner':    () => Scanner.render(content),
    'deliveries': () => Deliveries.render(content),
    'financial':  () => Financial.render(content),
    'users_admin':() => UsersAdmin.render(content),
    'commissions':() => Commissions.render(content),
    'settings':   () => Settings.render(content),
    'profile':    () => Profile.render(content)
  };

  try {
    if (modules[moduleId]) await modules[moduleId]();
    else content.innerHTML = '<p>Módulo não encontrado.</p>';
  } catch(err) {
    content.innerHTML = `<p style="color:red">Erro ao carregar: ${err.message}</p>`;
  }
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  // No celular/tablet a sidebar vira um menu-gaveta (classe "open").
  // No desktop ela só encolhe para ícones (classe "collapsed").
  if (window.innerWidth <= 768) {
    sidebar.classList.toggle('open');
  } else {
    sidebar.classList.toggle('collapsed');
  }
}
function closeSidebar() { if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open'); }

// Evita estado inconsistente ao redimensionar a janela (ex: girar o
// tablet, ou usar um notebook perto do breakpoint) — limpa a classe
// que não faz sentido no novo tamanho de tela.
let _lastIsMobile = window.innerWidth <= 768;
window.addEventListener('resize', () => {
  const isMobile = window.innerWidth <= 768;
  if (isMobile !== _lastIsMobile) {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.remove(isMobile ? 'collapsed' : 'open');
    _lastIsMobile = isMobile;
  }
});
function toggleUserMenu() {
  const m = document.getElementById('user-menu');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
}

// ── Tema (claro/escuro) e Paleta de cores ────────────────────
// O atributo já foi setado antes do primeiro paint (ver <head>);
// aqui só sincronizamos o ícone/bolinha ativa e cuidamos da troca.
function applyTheme(theme, persist = true) {
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('theme-icon');
  if (icon) icon.textContent = theme === 'light' ? '☀️' : '🌙';
  if (persist) localStorage.setItem('colchoeiro_theme', theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}
function applyPalette(palette, persist = true) {
  document.documentElement.setAttribute('data-palette', palette);
  document.querySelectorAll('.palette-dot').forEach(d => d.classList.toggle('active', d.getAttribute('data-palette') === palette));
  if (persist) localStorage.setItem('colchoeiro_palette', palette);
}
function togglePalettePicker() {
  const el = document.getElementById('palette-picker');
  el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
}
applyTheme(localStorage.getItem('colchoeiro_theme') || 'dark', false);
applyPalette(localStorage.getItem('colchoeiro_palette') || 'indigo', false);

function handleSwitchProfile() {
  document.getElementById('user-menu').style.display = 'none';
  let pin = '';
  const render = () => `
    <div style="text-align:center">
      <div style="display:flex;justify-content:center;gap:10px;margin-bottom:20px">
        ${[0,1,2,3].map(i => `<div style="width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);${i < pin.length ? 'background:var(--accent);border-color:var(--accent)' : ''}"></div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto">
        ${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k => k === ''
          ? '<div></div>'
          : `<button class="btn btn-secondary" style="height:56px;font-size:18px" onclick="_switchPad('${k}')">${k}</button>`
        ).join('')}
      </div>
      <div id="switch-pin-error" style="color:var(--red);font-size:13px;margin-top:14px;display:none">PIN incorreto.</div>
    </div>`;

  window._switchPad = async (k) => {
    const err = document.getElementById('switch-pin-error');
    if (err) err.style.display = 'none';
    if (k === '⌫') { pin = pin.slice(0, -1); }
    else if (pin.length < 4) { pin += k; }
    document.querySelector('.modal-body').innerHTML = render();
    if (pin.length === 4) {
      UI.loading(true);
      const res = await Auth.selectProfile(pin);
      UI.loading(false);
      if (res.ok) { window.location.reload(); }
      else {
        pin = '';
        document.querySelector('.modal-body').innerHTML = render();
        document.getElementById('switch-pin-error').style.display = 'block';
      }
    }
  };

  UI.modal({ title: 'Trocar Perfil', size: 'sm', body: render(), actions: [] });

  // Permite digitar o PIN pelo teclado físico (notebook/desktop) enquanto
  // este modal estiver aberto. O listener se remove sozinho ao detectar
  // que o modal foi fechado, então não interfere no resto do app.
  const keyHandler = (e) => {
    if (!document.getElementById('modal-overlay')) {
      document.removeEventListener('keydown', keyHandler);
      return;
    }
    if (e.key >= '0' && e.key <= '9') window._switchPad(e.key);
    else if (e.key === 'Backspace') window._switchPad('⌫');
  };
  document.addEventListener('keydown', keyHandler);
}

document.addEventListener('click', e => {
  if (!e.target.closest('#topbar-avatar') && !e.target.closest('#user-menu')) {
    document.getElementById('user-menu').style.display = 'none';
  }
  if (!e.target.closest('#palette-btn') && !e.target.closest('#palette-picker')) {
    const pp = document.getElementById('palette-picker');
    if (pp) pp.style.display = 'none';
  }
});

let searchTimeout;
function handleSearch(v) {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { if (window.GlobalSearch) GlobalSearch.run(v); }, 400);
}
</script>
</body>
</html>
