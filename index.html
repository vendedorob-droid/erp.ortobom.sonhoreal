<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colchoeiro ERP — Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    body {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: #0f111a; overflow-y: auto; padding: 24px 0;
    }
    .pin-wrap { width: 100%; max-width: 360px; padding: 24px; text-align: center; margin: auto; }

    .welcome-wrap { margin-bottom: 28px; opacity: 0; animation: welcomeIn .8s ease forwards; }
    .welcome-icon {
      width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center; font-size: 30px;
      box-shadow: 0 10px 30px rgba(99,102,241,.35);
      animation: welcomeFloat 3s ease-in-out infinite;
    }
    .welcome-title {
      font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -.02em;
      background: linear-gradient(90deg, #fff, #c7c9ff, #fff);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: welcomeShine 3.5s linear infinite;
    }
    .welcome-sub { font-size: 13px; color: #64748b; margin-top: 7px; }

    @keyframes welcomeIn {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes welcomeFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes welcomeShine {
      to { background-position: -200% center; }
    }

    /* Cantos menos arredondados (mais retangular) — combina melhor com
       os botões numéricos, que também deixaram de ser círculos perfeitos. */
    .pin-card { background: #171924; border: 1px solid rgba(255,255,255,.07); border-radius: 18px; padding: 36px 28px; opacity: 0; animation: welcomeIn .8s ease .15s forwards; }
    .pin-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #fff; }
    .pin-sub { font-size: 14px; color: #64748b; margin-bottom: 26px; }
    .pin-input-group { display: flex; justify-content: center; gap: 12px; margin-bottom: 26px; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #334155; transition: all 0.2s; }
    .pin-dot.active { background: #6366f1; border-color: #6366f1; box-shadow: 0 0 15px rgba(99,102,241,0.5); }
    .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .pin-btn {
      width: 68px; height: 60px; border-radius: 16px; background: #1e2030; border: 1px solid rgba(255,255,255,.05);
      color: #fff; font-size: 22px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.1s;
    }
    .pin-btn:active { background: #6366f1; transform: scale(0.94); }
    .pin-btn.empty { background: transparent; border: none; cursor: default; }
    .pin-btn.back { font-size: 18px; color: #64748b; }
    .error-msg { color: #ef4444; font-size: 13px; margin-top: 15px; display: none; }

    /* Telas baixas (notebook com janela pequena, celular deitado):
       encolhe tudo um pouco para não precisar rolar. */
    @media (max-height: 720px) {
      body { padding: 14px 0; }
      .welcome-wrap { margin-bottom: 16px; }
      .welcome-icon { width: 48px; height: 48px; font-size: 22px; margin-bottom: 10px; }
      .welcome-title { font-size: 21px; }
      .pin-card { padding: 24px 24px; }
      .pin-sub { margin-bottom: 18px; }
      .pin-input-group { margin-bottom: 18px; }
      .pin-btn { height: 50px; }
      .pin-grid { gap: 9px; }
    }
  </style>
</head>
<body>

<div class="pin-wrap">
  <div class="welcome-wrap">
    <div class="welcome-icon">🛏️</div>
    <div class="welcome-title">Bem-vindo ao Colchoeiro ERP</div>
    <div class="welcome-sub">Digite seu PIN para continuar</div>
  </div>

  <div class="pin-card">
    <div class="pin-title">Acesso ao ERP</div>
    <div class="pin-sub" id="pin-sub">Digite seu PIN de acesso</div>
    
    <div class="pin-input-group" id="pin-dots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>

    <div class="pin-grid">
      <button class="pin-btn" onclick="addNum('1')">1</button>
      <button class="pin-btn" onclick="addNum('2')">2</button>
      <button class="pin-btn" onclick="addNum('3')">3</button>
      <button class="pin-btn" onclick="addNum('4')">4</button>
      <button class="pin-btn" onclick="addNum('5')">5</button>
      <button class="pin-btn" onclick="addNum('6')">6</button>
      <button class="pin-btn" onclick="addNum('7')">7</button>
      <button class="pin-btn" onclick="addNum('8')">8</button>
      <button class="pin-btn" onclick="addNum('9')">9</button>
      <div class="pin-btn empty"></div>
      <button class="pin-btn" onclick="addNum('0')">0</button>
      <button class="pin-btn back" onclick="backspace()">⌫</button>
    </div>

    <div id="error-msg" class="error-msg">PIN incorreto. Tente novamente.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>

<script>
  let currentPin = "";
  const dots = document.querySelectorAll('.pin-dot');

  Auth.init((profile) => {
    if (profile) window.location.href = 'dashboard.html';
  });

  function addNum(num) {
    if (currentPin.length >= 4) return;
    currentPin += num;
    updateDots();
    
    if (currentPin.length === 4) {
      checkPin();
    }
  }

  function backspace() {
    currentPin = currentPin.slice(0, -1);
    updateDots();
    document.getElementById('error-msg').style.display = 'none';
  }

  function updateDots() {
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i < currentPin.length);
    });
  }

  async function checkPin() {
    const res = await Auth.selectProfile(currentPin);
    if (res.ok) {
      window.location.href = 'dashboard.html';
    } else {
      document.getElementById('error-msg').textContent = res.message;
      document.getElementById('error-msg').style.display = 'block';
      currentPin = "";
      setTimeout(updateDots, 300);
    }
  }

  // Permite digitar o PIN pelo teclado físico (útil em notebook/desktop),
  // além de tocar nos botões — não há outros campos de texto nesta tela,
  // então é seguro ouvir o teclado na página inteira.
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') addNum(e.key);
    else if (e.key === 'Backspace') backspace();
  });
</script>
</body>
</html>
